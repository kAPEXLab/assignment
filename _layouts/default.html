<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ site.title }}</title>
  <style>
    :root {
      --header-h: 64px;
      --sidebar-w: 280px;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #6b7280;
      --accent: #1f2937;
      --link: #1e40af;
      --link-hover: #0ea5e9;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, Segoe UI, Arial, Helvetica, sans-serif; }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }

    /* Header */
    header {
      position: sticky; top: 0; z-index: 1000;
      height: var(--header-h);
      display: flex; align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: #fff;
    }
    header .title {
      font-weight: 700; letter-spacing: .2px; color: var(--accent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Layout */
    .wrap { display: flex; min-height: calc(100vh - var(--header-h)); }
    aside {
      width: var(--sidebar-w);
      border-right: 1px solid var(--border);
      padding: 16px;
      position: sticky; top: var(--header-h);
      align-self: flex-start;
      max-height: calc(100vh - var(--header-h));
      overflow: auto;
      background: #fff;
    }
    main {
      flex: 1; padding: 24px;
      min-width: 0;
    }

    /* Sidebar nav */
    .nav-title { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; }
    .nav-list { list-style: none; margin: 0; padding: 0; }
    .nav-list li { margin: 6px 0; }
    .nav-link {
      display: block; padding: 6px 8px; border-radius: 8px;
    }
    .nav-link[aria-current="page"] {
      background: #f1f5f9; font-weight: 600; color: var(--accent);
    }

    /* Content styles */
    main h1 { margin-top: 0; font-size: 28px; }
    main h2 { margin-top: 1.5em; font-size: 22px; }
    main h3 { margin-top: 1.25em; font-size: 18px; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    pre { background: #0b1020; color: #e6edf3; padding: 14px; border-radius: 10px; overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
    img { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <!-- Always-on header -->
  <header>
    <div class="title">{{ site.title }}</div>
  </header>

  <div class="wrap">
    <!-- Persistent sidebar index -->
    <aside>
      <p class="nav-title">Index</p>
      <ul class="nav-list">
        {% assign pages_sorted = site.pages | where_exp:'p','p.nav == true' | sort:'nav_order' %}
        {% for p in pages_sorted %}
          <li>
            <a class="nav-link"
               href="{{ p.url | relative_url }}"
               {% if p.url == page.url %}aria-current="page"{% endif %}>
              {{ p.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </aside>

    <!-- Right-side content -->
    <main>
      {% if page.title and page.hide_title != true %}
        <h1>{{ page.title }}</h1>
      {% endif %}
      {{ content }}
    </main>
  </div>
</body>
</html>
